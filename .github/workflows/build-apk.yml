name: Build WinTracker APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
      - name: Unpack Android project
        run: |
          mkdir -p extracted
          unzip -q 'WinTracker-0.2.0.zip' -d extracted
          find extracted -name settings.gradle.kts -o -name settings.gradle
      - name: Apply WinTracker launcher icon
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/apply_launcher_icon.py
      - name: Integrate contest screens\n        run: python3 scripts/apply_contests.py\n      - name: Build debug APK
        run: |
          PROJECT=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -1)
          test -n "$PROJECT"
          cd "$PROJECT"
          sed -i 's/fun setLanguage(code: String)/fun updateLanguage(code: String)/g' app/src/main/java/com/macoshapps/wintracker/data/WinStore.kt
          grep -RIl 'store.setLanguage(' app/src/main/java | xargs -r sed -i 's/store\.setLanguage(/store.updateLanguage(/g'
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WinTracker-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
